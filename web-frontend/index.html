<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semantic Image Search</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🔍 Semantic Image Search</h1>
            <p class="subtitle">Search images using natural language or upload an image to find similar ones</p>
        </header>

        <div class="search-section">
            <div class="tabs">
                <button class="tab active" data-tab="text">Text Search</button>
                <button class="tab" data-tab="image">Image Search</button>
            </div>

            <!-- Text Search Tab -->
            <div id="text-search" class="tab-content active">
                <div class="search-box">
                    <input type="text" id="text-query" placeholder="e.g., yellow flowers, wild animals, wooden furniture..." />
                    <div class="search-controls">
                        <div class="control-group">
                            <label for="text-category">Category:</label>
                            <select id="text-category">
                                <option value="">All Categories</option>
                            </select>
                        </div>
                        <div class="control-group">
                            <label for="text-k">Results:</label>
                            <input type="number" id="text-k" value="10" min="1" max="50" />
                        </div>
                        <button id="text-search-btn" class="search-btn">Search</button>
                    </div>
                </div>
            </div>

            <!-- Image Search Tab -->
            <div id="image-search" class="tab-content">
                <div class="upload-box">
                    <input type="file" id="image-upload" accept="image/*" hidden />
                    <label for="image-upload" class="upload-label">
                        <div class="upload-icon">📁</div>
                        <p>Click to upload an image or drag and drop</p>
                        <p class="upload-hint">Supported: JPG, PNG, WEBP</p>
                    </label>
                    <div id="preview-container" class="hidden">
                        <img id="preview-image" src="" alt="Preview" />
                        <button id="clear-image" class="clear-btn">✕</button>
                    </div>
                </div>
                <div class="search-controls">
                    <div class="control-group">
                        <label for="image-category">Category:</label>
                        <select id="image-category">
                            <option value="">All Categories</option>
                        </select>
                    </div>
                    <div class="control-group">
                        <label for="image-k">Results:</label>
                        <input type="number" id="image-k" value="10" min="1" max="50" />
                    </div>
                    <button id="image-search-btn" class="search-btn" disabled>Search Similar</button>
                </div>
            </div>
        </div>

        <!-- Results Section -->
        <div id="results-section" class="hidden">
            <div class="results-header">
                <h2>Search Results</h2>
                <div id="results-info"></div>
            </div>
            <div id="results-grid" class="results-grid"></div>
        </div>

        <!-- Loading Spinner -->
        <div id="loading" class="loading hidden">
            <div class="spinner"></div>
            <p>Searching...</p>
        </div>

        <!-- Collection Info -->
        <div class="collection-info">
            <h3>Collection Status</h3>
            <div id="collection-status"></div>
        </div>
    </div>

    <script src="app.js?v=2"></script>
</body>
</html>
